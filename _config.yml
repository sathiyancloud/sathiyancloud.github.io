  An initiative by Sathiyan to bridge classroom theory with real-world IT skills.
url: "https://sathiyancloud.github.io"
baseurl: ""
author:
  name: Sathiyan
  initiative: Classroom to Cloud
  linkedin: "https://www.linkedin.com/in/sathiyancloud"

# Used by jekyll-seo-tag for sameAs / social metadata
social:
  name: Sathiyan
  links:
    - "https://www.linkedin.com/in/sathiyancloud"

markdown: kramdown
permalink: /blog/:title/

# GitHub Pages–supported plugins (no Node build required)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

navigation:
  - title: Home
    url: /
  - title: Blog
    url: /blog
  - title: About
    url: /about
  - title: Contact
    url: /contact
  - title: Session
    url: /session

exclude:
  - archive

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: Sathiyan
